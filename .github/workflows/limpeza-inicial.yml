name: Limpeza única dos testes anteriores à fase 2
on:
  pull_request:
    paths:
      - 'maintenance/limpeza-inicial.json'
      - 'maintenance/limpar-testes-iniciais.mjs'
      - 'lib/initial-cleanup.mjs'
      - '.github/workflows/limpeza-inicial.yml'
  push:
    branches: [main]
    paths: ['maintenance/limpeza-inicial.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-maintenance
  cancel-in-progress: false
jobs:
  limpar:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'uweellhd')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix maintenance --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Conferir inventário sem excluir dados
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node maintenance/limpar-testes-iniciais.mjs
      - name: Executar uma única limpeza autorizada
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node maintenance/limpar-testes-iniciais.mjs --aplicar
