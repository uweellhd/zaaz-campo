name: Testar permissões por setor
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests/security --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix maintenance --ignore-scripts --no-audit --no-fund
      - name: Testes de campos e retenção
        run: node --test tests/*.test.mjs
      - name: Testes com usuários fictícios no emulador
        run: npm test --prefix tests/security

  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - name: Preparar Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Preparar pacote estático do Cloudflare Pages
        run: node maintenance/preparar-pages.mjs
      - name: Conferir pacote, rotas, fluxos, relatórios, cargos, temas e conexão
        env:
          NEXTFLOW_PUBLIC_DIR: maintenance/pages-public
          NEXTFLOW_PAGES_EMULATION: '1'
        run: node tests/browser/stage-one.cjs
