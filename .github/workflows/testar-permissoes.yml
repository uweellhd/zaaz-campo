name: Testar permissões por setor
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permissoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tests/security --ignore-scripts --no-audit --no-fund
      - name: Testes de campos e retenção
        run: node --test tests/*.test.mjs
      - name: Testes com usuários fictícios no emulador
        run: npm test --prefix tests/security
