<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAAZ Telecom - Acesso Corporativo</title>

  <!-- Fonte Google Inter e Estilos Globais -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <!-- CANVAS DA ANIMAÇÃO DE FIBRA ÓTICA -->
  <canvas id="fiberCanvas"></canvas>

  <div class="login-card">
    <div class="brand-header">
      <h1 style="color: var(--zaaz-blue); font-weight: 800; letter-spacing: -0.5px;">ZAAZ TELECOM</h1>
      <p>NextFlow Enterprise System</p>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <div id="loginSection">
      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">E-mail corporativo:</label>
          <input type="email" id="usuario" placeholder="seu.email@empresa.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="senha">Senha de Acesso:</label>
          <input type="password" id="senha" placeholder="Digite sua senha..." required autocomplete="current-password">
        </div>

        <button type="submit" id="btnLogin" class="btn-primary">Entrar no Sistema</button>
        <div id="errorMsg" class="error-box">Usuário ou senha incorretos!</div>
      </form>
    </div>

    <!-- ÁREA DE RECEPÇÃO / BOAS-VINDAS (PÓS-LOGIN) -->
    <div id="welcomeSection" class="welcome-card">
      <h2 id="saudacaoTexto">Carregando...</h2>
      <p id="usuarioNomeDisplay">Autenticando perfil corporativo...</p>
      <span id="perfilBadge" class="badge-perfil">Perfil</span>
    </div>
  </div>

  <!-- RODAPÉ CORPORATIVO -->
  <footer class="app-footer">
    Um produto <strong>NextFlow</strong>
  </footer>

  <!-- Script JavaScript Modular do Firebase e Animação -->
  <script type="module" src="js/login.js"></script>
</body>
</html>
